        remote: https://github.com/Kairos-Business-Solutions/KairosTSApp.git
        subpath: [OrchestratorService.Api, frontend]
        branch: phase-2-build                              # confirmed 2026-08-12 — server tracks this, not main
    stakeholders:
      client_pm: Iwan (Group IT)
      product_owner: Ken Ho
      devs: [Dyah Puspo Rini]
      active_dev: Dyah Puspo Rini
    plane:
      workspace: kairos
      project: 461f73d9-ae23-4894-a4af-a801f2f0ea09        # KAIROSTSAP
    epicor:
      instances:
        pilot:
          url: https://taisin-third.epicorsaas.com/server   # confirmed in OrchestratorService.Api/appsettings.json
          kepicorhelper_profile: taisin_third               # verify actual slug in KEpicorHelper
        live:
          url: via ${EPICOR_SERVER_INSTANCE} in .env.live   # value not hardcoded in repo — read from .env.live on the server
          kepicorhelper_profile: taisin_live                # verify actual slug in KEpicorHelper
    companies:
      # Tai Sin group companies synced by orchestrator (appsettings.Sync.Companies)
      list: [LKHE, LKHP, LKHPD, TSPD, EG, TSE]
      primary: LKHE
      google_drive_ids:                                    # per-company Shared Drive for PDF uploads
        01_LKHE: 0AMbJQP6BGaysUk9PVA
        02_LKHP: 0AL_v7KWOLG5sUk9PVA
        03_LKHPD: 0ABOjLKIz0wyPUk9PVA
        04_TSPD: 0AHo5qvb7ix8tUk9PVA
        05_EG: 0AHuLradvqQT-Uk9PVA
    urls:
      production_new: https://tsapp.ksol.ai                # LIVE stack (Ken 2026-07-31 migration off kairosai.bot)
      pilot: https://tsapp-pilot.ksol.ai                   # PILOT/test stack
      production_old: https://tsapp.kairosai.bot           # legacy — moving off
    deploys:                                               # TWO stacks on ONE host — never share DB volumes
      pilot:
        type: docker
        target: ssh
        ssh_host: tsapp                                    # → cloud2.kairossolutions.co:7723 per meta.ssh_aliases
        mode: advisory                                     # Claude prepares command, user runs (sudo needs password)
        path: /opt/KairosTSApp                             # confirmed 2026-08-12 via ssh
        compose_file: docker-compose.yml
        compose_project: tsapp                             # docker compose -p tsapp
        env_file: .env
        services: [mssql, orchestrator-api, frontend]
        containers: [kairos-mssql, orchestrator-service, kairos-frontend]
        ports:
          frontend: 3000
          api: 5000
        health:
          - name: api
            url: http://localhost:5000/health
        secrets_dir: ./secrets/                            # epicor-credentials.json, google-drive-sa.json, email-config.json
        volume: mssql-data
        uses_epicor: pilot                                 # references epicor.instances.pilot
        common_commands:                                   # Dyah's actual workflow — Claude generates these verbatim in advisory mode
          deploy: |
            cd /opt/KairosTSApp
            git pull
            sudo docker compose up -d --build
          db_shell: |
            sudo docker exec -it kairos-mssql \
              /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -d KairosTSDB
          tail_api_logs: |
            sudo docker logs orchestrator-service -f --tail=1000
          tail_frontend_logs: |
            sudo docker logs kairos-frontend -f --tail=200
          restart_only:                                    # no rebuild — for config-only changes
            sudo docker compose restart orchestrator-api
      live:
        type: docker
        target: ssh
        ssh_host: tsapp                                    # same host as pilot
        mode: advisory                                     # Claude prepares command, user runs (sudo needs password)
        path: /opt/KairosTSApp                             # same repo checkout as pilot (both stacks run from one clone)
        compose_file: docker-compose.live.yml
        compose_project: tsapp-live                        # docker compose -p tsapp-live
        env_file: .env.live
        services: [mssql, orchestrator-api, frontend]
        containers: [kairos-mssql-live, orchestrator-service-live, kairos-frontend-live]
        ports:
          frontend: 3001
          api: 5001
        health:
          - name: api
            url: http://localhost:5001/health
        secrets_dir: ./secrets-live/                       # separate secrets from pilot
        volume: mssql-data-live                            # DISTINCT from pilot volume — never share
        uses_epicor: live                                  # references epicor.instances.live
        common_commands:                                   # LIVE needs the explicit -p/-f/--env-file flags — bare `docker compose up` hits pilot
          deploy: |
            cd /opt/KairosTSApp
            git pull
            sudo docker compose -p tsapp-live --env-file .env.live -f docker-compose.live.yml up -d --build
          db_shell: |
            sudo docker exec -it kairos-mssql-live \
              /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -d KairosTSDB
          tail_api_logs: |
            sudo docker logs orchestrator-service-live -f --tail=1000
          tail_frontend_logs: |
            sudo docker logs kairos-frontend-live -f --tail=200
          restart_only:
            sudo docker compose -p tsapp-live -f docker-compose.live.yml restart orchestrator-api
        # ⚠️ InvoiceHeaders stores Epicor company as plain string — no env marker.
        # Two stacks sharing one DB makes pilot/live invoices indistinguishable — that's WHY separate stacks.
        # ⚠️ Bare `sudo docker compose up` (no flags) hits PILOT — Live REQUIRES the -p/-f/--env-file trio.

