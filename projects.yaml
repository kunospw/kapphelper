# projects.yaml — KAppHelper registry
#
# One entry per app (internal Kairos product) or client (external engagement).
# Anything Claude needs to know about "where does this project live and how do we ship it"
# comes from here — never hardcoded in a skill.
#
# Schema:
#   apps.<slug>       — internal Kairos products with no bound external client
#   clients.<slug>    — external engagements; may span multiple repos/apps
#
# Fill-level convention:
#   - `active_dev` set   → fully populated, currently being worked on
#   - `active_dev: null` → skeleton entry; fill deploy/stakeholders block when work starts
#
# Deploy types:
#   - docker           → docker compose stack, target=local or ssh
#   - mobile-ios       → Flutter iOS build → App Store Connect (see iOS-Deployment-Guide.md)
#   - mobile-android   → Android build → Play Store
#   - not-owned        → we don't touch deploy (someone else owns it)
#   - none             → not deployed / not applicable
#
# Deploy modes (docker only):
#   - executed         → Claude runs the deploy command end-to-end (needs passwordless
#                        docker access on the target — docker group or rootless docker)
#   - advisory         → Claude prepares the command and hands it to the user; user
#                        runs in their own SSH terminal (types sudo password there);
#                        Claude does non-privileged verification (curl health etc.)
#                        Use this whenever docker requires sudo password.
#
# Field naming — unambiguous:
#   - deploy.ssh_host        → SSH alias (from ~/.ssh/config) — used when target: ssh
#   - deploy.runs_on         → machine identifier — used when target: local (informational)
#   - deploy.path            → repo checkout path ON the deploy machine
#   - epicor.instances.<env>.url → Epicor server URL the APP calls out to (NOT SSH)
#
# Credentials are NEVER stored here — see `credentials_ref` fields for pointers.

meta:
  updated: 2026-08-12
  version: 1
  github_org: Kairos-Business-Solutions
  credentials_ref: "D:/Dee's archivest/projects/Kairos/Kairos_Projects_Overview.docx"    # local-only
  mobile_deploy_guide: "D:/Dee's archivest/projects/Kairos/iOS-Deployment-Guide.md"

  # SSH aliases used across projects. Each dev configures these in their OWN
  # ~/.ssh/config with their OWN user + identity file. This block documents
  # what needs to exist; it does NOT hold personal keys.
  #
  # Naming: alias == project it primarily serves (not the DNS name), because
  # cloud2.kairossolutions.co:7723 resolves to a dedicated TSApp box (Linux
  # hostname `kairostsapp`), and other Kairos apps use different SSH ports.
  ssh_aliases:
    tsapp:
      hostname: cloud2.kairossolutions.co                # DNS entry → routes to `kairostsapp` box
      port: 7723
      linux_hostname: kairostsapp                        # confirmed 2026-08-12 via ssh
      hosts: [tsapp-pilot stack, tsapp-live stack]       # ONLY TSApp — do NOT put KConnect etc. here
      docker_access: |
        User `drini` is NOT in the `docker` group (2026-08-12 verified) — cannot add per Dyah.
        Sudo requires password — cannot run non-interactively from Claude's SSH session.
        Ken's existing wrappers in /opt/<app>/scripts/ (e.g. deploy-now.sh) are plain
        `docker-compose` calls — they assume the runner is in the docker group (Ken is;
        drini is not). Deploy from Claude therefore uses `deploy_mode: advisory` per
        project — Claude prepares the command, user runs it in their own SSH terminal
        (where they can type the sudo password), Claude does non-privileged verification.
      ssh_config_example: |
          Host tsapp
              HostName cloud2.kairossolutions.co
              User <your-username>
              Port 7723
              IdentityFile ~/.ssh/<your-key>.pem
              ServerAliveInterval 60
    kconnect:
      hostname: <verify — cloud2.kairossolutions.co ? different DNS ?>
      port: <verify — different from tsapp per Dyah>
      linux_hostname: <verify — likely `kconnect01` per handbook>
      hosts: [KConnect docker stack (kdocverify, supplier, customer, activepieces, ...)]
      note: |
        Jesynta runs Claude Code natively on this box — target: local for KConnect projects.
        Dyah SSHes in for cross-check / occasional intervention.

  known_credential_leaks:                              # verified committed to git — rotate before any work
    # Values intentionally NOT reproduced here — grep the paths to see them.
    - path: KairosWeb/KairosWebAPI/appsettings.json
      contains: [DB SA password, JWT signing key, AWS S3 keys, SFTP credentials, Epicor API key + AUTHORIZATION_KEY (base64)]
      verified: 2026-08-12
    - path: KPortal-Backend/KEpicorCustomerPortal/appsettings.json
      contains: [DB SA password, JWT signing key, Epicor API key + AUTHORIZATION_KEY (base64), Square sandbox token, SMTP password, CryptoSecretKey]
      verified: 2026-08-12
    - path: KairosTSApp/scripts/deploy-now.sh
      contains: [Ken's API login password (LOGIN_PASSWORD), DB SA password (sqlcmd -P)]
      verified: 2026-08-12
    - path: KairosTSApp/scripts/deploy-now-simple.sh
      contains: [same as deploy-now.sh — LOGIN_PASSWORD + DB SA password]
      verified: 2026-08-12

  clean_secret_patterns:                               # examples to copy when refactoring the leaks above
    - KConnectApp/.env.example                         # all values are changeme_* placeholders; real .env is gitignored
    - KairosTSApp/OrchestratorService.Api/appsettings.json  # connection string = "Password=CHANGE_ME_VIA_ENV_VAR"; env vars from .env / .env.live; runtime creds in ./secrets/*.json mounted as Docker read-only files

